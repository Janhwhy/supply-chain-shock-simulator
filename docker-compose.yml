version: '3.8'

services:
  shockproof_db:
    image: postgres:15
    container_name: shockproof_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      #so data inside the container doesnt disappear 
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
